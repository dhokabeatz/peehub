name: Deploy — Dev

# Triggers on every push to the develop branch.
on:
  push:
    branches:
      - develop

# Concurrency: if a newer push arrives while this run is still in progress,
# cancel the older run. The group key is per-branch so prod and dev never
# cancel each other.
concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Vercel (preview)
    runs-on: ubuntu-latest

    # Reference the GitHub Actions "dev" environment.
    # Secrets scoped to this environment are available here.
    # Required secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
    environment: dev

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate deployment scope
        run: |
          test "${GITHUB_REF_NAME}" = "develop"
          echo "Deploying develop branch to Preview environment"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create .vercel/project.json
        run: |
          mkdir -p .vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > .vercel/project.json

      - name: Pull Vercel environment config
        run: vercel pull --yes --environment=preview --git-branch=develop --token=${{ secrets.VERCEL_TOKEN }}

      - name: Prepare production DB comparison values
        run: |
          test -n "$PRODUCTION_DATABASE_URL"
          test -n "$PRODUCTION_DIRECT_URL"
          cat > .vercel/.env.production.compare <<EOF
          DATABASE_URL="$PRODUCTION_DATABASE_URL"
          DIRECT_URL="$PRODUCTION_DIRECT_URL"
          EOF

      - name: Validate database separation
        run: node scripts/ci/check-db-separation.mjs .vercel/.env.preview.local .vercel/.env.production.compare

      - name: Generate Prisma client
        run: |
          set -a
          source .vercel/.env.preview.local
          set +a
          npx prisma generate

      - name: Check migration status
        run: |
          set -a
          source .vercel/.env.preview.local
          set +a
          npx prisma migrate status

      - name: Apply migrations
        run: |
          set -a
          source .vercel/.env.preview.local
          set +a
          npx prisma migrate deploy

      - name: Verify required schema
        run: |
          set -a
          source .vercel/.env.preview.local
          set +a
          npx tsx scripts/ci/assert-required-schema.ts

      - name: Seed development database
        run: |
          set -a
          source .vercel/.env.preview.local
          set +a
          SEED_MODE=dev npx prisma db seed

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npx tsc --noEmit

      - name: Build application
        run: |
          set -a
          source .vercel/.env.preview.local
          set +a
          npm run build

      - name: Vercel build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOYMENT_URL=${DEPLOYMENT_URL}" >> "$GITHUB_ENV"

      - name: Post-deployment health check
        run: |
          curl --fail --silent --show-error "$DEPLOYMENT_URL/api/health"
          curl --fail --silent --show-error "$DEPLOYMENT_URL/api/ready"
