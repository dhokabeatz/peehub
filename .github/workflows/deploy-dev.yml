name: Deploy — Dev

# Triggers on every push to the develop branch.
on:
  push:
    branches:
      - develop

# Concurrency: if a newer push arrives while this run is still in progress,
# cancel the older run. The group key is per-branch so prod and dev never
# cancel each other.
concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Vercel (preview)
    runs-on: ubuntu-latest

    # Reference the GitHub Actions "dev" environment.
    # Secrets scoped to this environment are available here.
    # Required secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
    environment: dev

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate deployment scope
        run: |
          test "${GITHUB_REF_NAME}" = "develop"
          echo "Deploying develop branch to Preview environment"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create .vercel/project.json
        run: |
          mkdir -p .vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > .vercel/project.json

      - name: Prepare database comparison values
        run: |
          test -n "$DATABASE_URL"
          test -n "$DIRECT_URL"
          test -n "$PRODUCTION_DATABASE_URL"
          test -n "$PRODUCTION_DIRECT_URL"
          cat > .ci.preview.env <<EOF
          DATABASE_URL="$DATABASE_URL"
          DIRECT_URL="$DIRECT_URL"
          EOF
          cat > .ci.production.env <<EOF
          DATABASE_URL="$PRODUCTION_DATABASE_URL"
          DIRECT_URL="$PRODUCTION_DIRECT_URL"
          EOF

      - name: Print database source diagnostics
        run: |
          echo "GitHub environment: dev"
          echo "Git branch: ${GITHUB_REF_NAME}"

      - name: Validate database separation
        run: node scripts/ci/check-db-separation.mjs .ci.preview.env .ci.production.env

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check migration status (diagnostic)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate status

      - name: Inspect develop database state
        id: inspect_db
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: node scripts/ci/inspect-db-state.mjs

      - name: Resolve baseline migration
        if: steps.inspect_db.outputs.baseline_needed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate resolve --applied 20260418000100_init_schema

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Check migration status (strict)
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate status

      - name: Verify required schema
        run: npx tsx scripts/ci/assert-required-schema.ts

      - name: Pull Vercel runtime environment config
        run: vercel pull --yes --environment=preview --git-branch=develop --token=${{ secrets.VERCEL_TOKEN }}

      - name: Prepare runtime environment file
        run: grep -vE '^(DATABASE_URL|DIRECT_URL)=' .vercel/.env.preview.local > .vercel/.env.preview.runtime.local

      - name: Seed development database
        run: |
          set -a
          source .vercel/.env.preview.runtime.local
          set +a
          export ADMIN_EMAIL="${ADMIN_EMAIL%\\n}"
          export ADMIN_FULL_NAME="${ADMIN_FULL_NAME%\\n}"
          export DEMO_USER_EMAIL="${DEMO_USER_EMAIL%\\n}"
          export DEMO_USER_FULL_NAME="${DEMO_USER_FULL_NAME%\\n}"
          SEED_MODE=dev npx prisma db seed

      - name: Re-run development seed for idempotency
        run: |
          set -a
          source .vercel/.env.preview.runtime.local
          set +a
          export ADMIN_EMAIL="${ADMIN_EMAIL%\\n}"
          export ADMIN_FULL_NAME="${ADMIN_FULL_NAME%\\n}"
          export DEMO_USER_EMAIL="${DEMO_USER_EMAIL%\\n}"
          export DEMO_USER_FULL_NAME="${DEMO_USER_FULL_NAME%\\n}"
          SEED_MODE=dev npx prisma db seed

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npx tsc --noEmit

      - name: Build application
        run: |
          set -a
          source .vercel/.env.preview.runtime.local
          set +a
          npm run build

      - name: Vercel build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOYMENT_URL=${DEPLOYMENT_URL}" >> "$GITHUB_ENV"

      - name: Post-deployment health check
        run: |
          curl --fail --silent --show-error "$DEPLOYMENT_URL/api/health"
          curl --fail --silent --show-error "$DEPLOYMENT_URL/api/ready"
