name: Deploy — Production

# Triggers on every push to the main branch.
on:
  push:
    branches:
      - main

# Concurrency: cancel any in-progress production deploy for main if a newer
# push lands. Scoped to prod only — never cancels a dev run.
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Vercel (production)
    runs-on: ubuntu-latest

    # Reference the GitHub Actions "prod" environment.
    # Secrets scoped to this environment are available here.
    # Required secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
    environment: prod

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Install dependencies ────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Prisma generate ─────────────────────────────────────────────────────
      # Generates the Prisma client from schema.prisma so the build can
      # import @prisma/client. The generated output is not committed to git.
      - name: Generate Prisma client
        run: npx prisma generate

      # ── Build ────────────────────────────────────────────────────────────────
      # Run next build locally first. If the build fails the deploy never runs.
      - name: Build application
        run: npm run build

      # ── Install Vercel CLI ───────────────────────────────────────────────────
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ── Recreate Vercel project link metadata in CI ────────────────────────
      # .vercel is gitignored locally, so CI reconstructs project.json from
      # environment-scoped secrets before calling vercel pull.
      - name: Create .vercel/project.json
        run: |
          mkdir -p .vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > .vercel/project.json

      # ── Pull Vercel project config ───────────────────────────────────────────
      # Downloads .vercel/project.json and production environment variables.
      - name: Pull Vercel environment config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # ── Vercel build ─────────────────────────────────────────────────────────
      # Builds the deployment artifact using Vercel's pipeline.
      - name: Vercel build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # ── Deploy to Vercel production ──────────────────────────────────────────
      # --prebuilt uses the artifact from the build step above.
      # --prod promotes the deployment to the production domain (peehub.hdolabs.com).
      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
