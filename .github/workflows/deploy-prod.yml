name: Deploy — Production

# Triggers on every push to the main branch.
on:
  push:
    branches:
      - main

# Concurrency: cancel any in-progress production deploy for main if a newer
# push lands. Scoped to prod only — never cancels a dev run.
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Vercel (production)
    runs-on: ubuntu-latest

    # Reference the GitHub Actions "prod" environment.
    # Secrets scoped to this environment are available here.
    # Required secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
    environment: prod

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate deployment scope
        run: |
          test "${GITHUB_REF_NAME}" = "main"
          echo "Deploying main branch to Production environment"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create .vercel/project.json
        run: |
          mkdir -p .vercel
          echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID }}"}' > .vercel/project.json

      - name: Pull Vercel environment config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Validate Paystack live-mode keys
        run: |
          set -a
          source .vercel/.env.production.local
          set +a
          PAYSTACK_SECRET_KEY_CLEAN="${PAYSTACK_SECRET_KEY%\\n}"
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY_CLEAN="${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY%\\n}"
          test -n "$PAYSTACK_SECRET_KEY_CLEAN"
          test -n "$NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY_CLEAN"
          case "$PAYSTACK_SECRET_KEY_CLEAN" in
            sk_live_*) ;;
            *) echo "PAYSTACK_SECRET_KEY must use live-mode prefix in Deploy — Production" >&2; exit 1 ;;
          esac
          case "$NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY_CLEAN" in
            pk_live_*) ;;
            *) echo "NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY must use live-mode prefix in Deploy — Production" >&2; exit 1 ;;
          esac

      - name: Pull Preview env for fingerprint comparison
        run: vercel env pull .vercel/.env.preview.compare --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Validate database separation
        run: node scripts/ci/check-db-separation.mjs .vercel/.env.preview.compare .vercel/.env.production.local

      - name: Generate Prisma client
        run: |
          set -a
          source .vercel/.env.production.local
          set +a
          npx prisma generate

      - name: Check migration status
        run: |
          set -a
          source .vercel/.env.production.local
          set +a
          npx prisma migrate status

      - name: Apply migrations
        run: |
          set -a
          source .vercel/.env.production.local
          set +a
          npx prisma migrate deploy

      - name: Verify required schema
        run: |
          set -a
          source .vercel/.env.production.local
          set +a
          npx tsx scripts/ci/assert-required-schema.ts

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npx tsc --noEmit

      - name: Build application
        run: |
          set -a
          source .vercel/.env.production.local
          set +a
          npm run build

      - name: Vercel build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "DEPLOYMENT_URL=${DEPLOYMENT_URL}" >> "$GITHUB_ENV"

      - name: Post-deployment health check
        run: |
          curl --fail --silent --show-error "$DEPLOYMENT_URL/api/health"
          curl --fail --silent --show-error "$DEPLOYMENT_URL/api/ready"
